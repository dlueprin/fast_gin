
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;

    ssl_certificate /etc/nginx/cert/cacert.pem;
    ssl_certificate_key /etc/nginx/cert/private.key;

    server {
        listen 80;
        listen 443 ssl;
        server_name 123.com;

        location / {
            root /usr/share/nginx/web;
            index index.html;
            try_files $uri $uri/ /index.html; #返回第一个找到的文件

        }
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr; #拿真实ip
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_pass http://10.2.0.7:8080/api/; #这里加上斜杠，是先替换匹配到的/api/login/中的/api/删掉，在把login添加到proxy_pass后面
        }

        location /uploads/ {
            alias /app/uploads/; #映射静态文件
        }

    }
}
